<!DOCTYPE html>
<html>
  <head>
    <title></title>
    <link rel="stylesheet" href="/styles/indexstyle.css">
    <link rel="icon" href="/resources/favicon.png">
    <meta name="viewport" content="width=device-width, height=device-height,initial-scale=1.0"/>
  </head>
  <body>
	<p id="LoadingResources" class="disappear">Not ready yet!</p>
    <audio id="Main" loop>
      <source src="/resources/soundtracks/main.mp3" type="audio/mpeg">
    </audio>
    <div id="VNStartScreen">
      <h1 id="Title"></h1>
      <div id="StartItems">
        <h2 id="PlayButton" class="Buttons">Play</h2>
        <p id="OptionsButton" class="Buttons" onclick="document.getElementById('Options').style.display = 'block'">Options</p>
      </div>
    </div>
    <div id="Options">
      <p>Volume</p>
      <input type="range" oninput="changeVolume()" id="VolumeRange"><p id="VolumeValue"></p>
      <p>Text Speed</p>
      <input type="range" oninput="changeSpeed()" id="SpeedRange"><p id="RangeValue"></p>
      <img src="/resources/close.svg" id="CloseButton" onclick="document.getElementById('Options').style.display = 'none'">
    </div>
    <img src="/resources/mute.svg" id="MuteImg">
    <script>
      if(localStorage.length == 0) {
		fetch("/config.json").then(config => config.json()).then(config => {
			document.title = config.title;
			localStorage.setItem("NovelTitle", config.title);
			Title.innerText = config.title;
			localStorage.setItem("TextSpeed", 40);
			localStorage.setItem("Volume", 50);
		})
	  } else {
		document.title = localStorage.NovelTitle;
		Title.innerText = localStorage.NovelTitle;
	  }
	  
	  document.getElementById("PlayButton").onclick = function() {
        if (LoadingResources.classList[0] === "disappear") {
			LoadingResources.classList.remove("disappear");
			LoadingResources.classList.add("appear");
			setTimeout(() => {
				LoadingResources.classList.remove("appear");
				LoadingResources.classList.add("disappear")
			}, 1000);
		}
      };
	  
      let MuteButton = document.getElementById("MuteImg");
      let Main = document.getElementById("Main");
      Main.volume = (parseInt(localStorage.Volume) || 50 )* 0.01;
      let SpeedRange = document.getElementById("SpeedRange");
      let RangeValue = document.getElementById("RangeValue");
      SpeedRange.value = localStorage.getItem("TextSpeed") || 40;
      VolumeRange.value = localStorage.Volume;
      RangeValue.innerText = SpeedRange.value + "ms";
      VolumeValue.innerText = VolumeRange.value + "%";
      
	  Main.play().then(() => {
		console.log("Awesome!");
		MuteButton.style.display = "none";
	  }).catch(() => {
		console.log("Cannot autoplay for now !");
	  });
	  
      MuteButton.onclick = function() {
        Main.play();
        MuteButton.style.display = "none";
      };
      
      function changeSpeed() {
        localStorage.setItem("TextSpeed", SpeedRange.value);
        RangeValue.innerText = SpeedRange.value + "ms"
      }
      function changeVolume() {
        localStorage.setItem("Volume", VolumeRange.value);
        VolumeValue.innerText = VolumeRange.value + "%";
        Main.volume = VolumeRange.value * 0.01;
      }
      
      async function forbidden() {
        let novel = await fetch("/novel.html");
        let raw = await novel.text();
        
        document.write(raw);
        return;
      }
	  
	  async function registerWorker() {
		if("serviceWorker" in navigator) {
			try {
				const register = await navigator.serviceWorker.register("/sw.js");
				if(register.active) console.log("Worker has been installed!");
			} catch (e) {
				console.error(`it exploded with ${e}`);
			}
		}
	  }
	  
	  registerWorker();
	  
	  navigator.serviceWorker.ready.then((r) => {
		r.active.postMessage({
			msg: "Has something changed?",
			date: new Date().toUTCString(),
		});
	  });
	  
	  navigator.serviceWorker.addEventListener("message", (e) => {
		if(e.data === "Resources are saved in cache." || e.data == "No change.") {
			localStorage.setItem("ResourcesLoaded", 1);
			document.getElementById("PlayButton").onclick = forbidden;
		}
	  });
	  
	  if(localStorage.ResourcesLoaded == 1 && !navigator.onLine) PlayButton.onclick = forbidden;
    </script>
  </body>
</html>
